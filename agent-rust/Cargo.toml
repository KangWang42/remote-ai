[package]
name = "remote-cli-agent"
version = "0.1.0"
edition = "2021"
description = "remote-cli agent for Linux: runs this computer's terminals for the phone"
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json", "tls"] }
serde_json = "1"
base64 = "0.22"
libc = "0.2"

[profile.release]
strip = true
