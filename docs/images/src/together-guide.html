<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>协作：让几段对话配合</title>
<link rel="stylesheet" href="figure.css">
</head>
<body>
<main data-width="1200">
  <div class="sheet">
    <div class="guide">
      <div class="phone"><div class="shot">
        <img src="../together.png" alt="">
        <i class="mark" style="left: -14px; top: 136px">1</i>
        <i class="mark" style="left: 404px; top: 136px">2</i>
        <i class="mark" style="left: -14px; top: 305px">3</i>
        <i class="mark" style="left: -14px; top: 574px">4</i>
      </div></div>
      <ol class="notes">
        <li><i class="n">1</i><div><b>交接对话</b><span>把一段对话的进展交给另一段：电脑端整理最初和最近的要求、最后的回答、最近的操作，写给接手的对话。</span></div></li>
        <li><i class="n">2</i><div><b>同时提问</b><span>同一个问题一次发给几段对话，例如让 Claude Code 和 Codex 各给一个方案。</span></div></li>
        <li><i class="n">3</i><div><b>接力</b><span>一段对话停下后，把它最后的回答连同你的要求交给另一段，例如 Codex 改完由 Claude Code 审查。次数用完就停。</span></div></li>
        <li><i class="n">4</i><div><b>定时提问</b><span>到时间把一句话发给指定的对话：一次、每天定时，或每隔一段时间。卡片上写着下次的时间和上次的结果。</span></div></li>
      </ol>
    </div>
  </div>
</main>
</body>
</html>
