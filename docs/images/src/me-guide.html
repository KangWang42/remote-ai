<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>我的：工作统计</title>
<link rel="stylesheet" href="figure.css">
</head>
<body>
<main data-width="1200">
  <div class="sheet">
    <div class="guide">
      <div class="phone"><div class="shot">
        <img src="../me.png" alt="">
        <i class="mark" style="left: -14px; top: 256px">1</i>
        <i class="mark" style="left: 404px; top: 405px">2</i>
        <i class="mark" style="left: -14px; top: 498px">3</i>
        <i class="mark" style="left: -14px; top: 746px">4</i>
        <i class="mark" style="left: 404px; top: 50px">5</i>
      </div></div>
      <ol class="notes">
        <li><i class="n">1</i><div><b>今天</b><span>提问次数、用到的对话、工具的工作时长，以及提问后多久得到第一次响应；下面一行是昨天的数。</span></div></li>
        <li><i class="n">2</i><div><b>近 7 天或近 30 天</b><span>切换统计的时间范围。</span></div></li>
        <li><i class="n">3</i><div><b>这段时间的合计</b><span>提问、工作时长、有记录的天数，以及输入、输出和缓存的 token。</span></div></li>
        <li><i class="n">4</i><div><b>每天的柱状图</b><span>按提问、时长或 token 查看，点某一天显示当天的数。往下还有按工具、按项目和按时段的分布。</span></div></li>
        <li><i class="n">5</i><div><b>设置</b><span>连接线路、电脑端设置、外观、App 更新和退出登录。</span></div></li>
      </ol>
    </div>
  </div>
</main>
</body>
</html>
