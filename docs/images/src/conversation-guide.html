<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对话窗口里能做什么</title>
<link rel="stylesheet" href="figure.css">
<style>
  .phone img { height: 844px; }
</style>
</head>
<body>
<main data-width="1200">
  <div class="sheet">
    <div class="guide">
      <div class="phone"><div class="shot">
        <img src="../look.png" alt="">
        <i class="mark" style="left: 404px; top: 73px">1</i>
        <i class="mark" style="left: -14px; top: 290px">2</i>
        <i class="mark" style="left: 62px; top: 670px">3</i>
        <i class="mark" style="left: 152px; top: 758px">4</i>
        <i class="mark" style="left: 272px; top: 758px">5</i>
      </div></div>
      <ol class="notes">
        <li><i class="n">1</i><div><b>连接的是电脑上原来的对话</b><span>手机发的消息交给原来的应用，电脑上可以照常接着用；关掉这一页不会结束任务。</span></div></li>
        <li><i class="n">2</i><div><b>看得到过程，不只是最后的回答</b><span>它边做边说的话、每一步的命令和输出的前几行，和在终端里看到的差不多。</span></div></li>
        <li><i class="n">3</i><div><b>它还在执行时也能发消息</b><span>消息逐条排队，写着“排队中”；交给对话之前可以撤回，电脑端重启也不会丢。</span></div></li>
        <li><i class="n">4</i><div><b>状态和计时</b><span>正在执行了多久、在等你确认，还是已经停下。</span></div></li>
        <li><i class="n">5</i><div><b>停止回答</b><span>结束这一轮，对话和电脑上的程序都保留，可以接着发下一句。</span></div></li>
      </ol>
    </div>
  </div>
</main>
</body>
</html>
