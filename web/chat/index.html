<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#fbfbfc">
  <meta name="robots" content="noindex">
  <meta name="description" content="在手机上进行的 Claude Code 或 Codex 对话。">
  <title>Remote AI</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="stylesheet" href="chat.css">
  <link rel="stylesheet" href="../conversation.css">
  <link rel="stylesheet" href="../ui/sheet.css">
  <link rel="stylesheet" href="../ui/attach.css">
  <script defer src="../terminal/skins.js"></script>
  <script defer src="../conversation.js"></script>
  <script defer src="../ui/sheet.js"></script>
  <script defer src="../ui/work.js"></script>
  <script defer src="../team-defaults.js"></script>
  <script defer src="../ui/restart.js"></script>
  <script defer src="../ui/switch.js"></script>
  <script defer src="../files/transfers.js"></script>
  <script defer src="../ui/attachment-names.js"></script>
  <script defer src="../ui/attach.js"></script>
  <script defer src="chat.js"></script>
  <script defer src="../terminal/bridge.js"></script>
</head>
<body>
  <main>
    <header>
      <button type="button" class="icon" id="back" aria-label="返回">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="who">
        <h1 id="title">对话</h1>
        <p id="where"><span id="dot" aria-hidden="true"></span><span id="where-text">正在连接…</span></p>
      </div>
      <div class="tools">
        <button type="button" class="icon" id="files" aria-label="查看项目文件" hidden>
          <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2.2h7a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="icon" id="menu" aria-label="对话选项">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>
        </button>
      </div>
    </header>
    <button type="button" id="team-bar" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span id="team-bar-text">已加入协作任务</span>
      <span class="team-bar-go">查看协作 ›</span>
    </button>
    <p id="link" role="status" aria-live="polite" hidden></p>
    <div id="reads">
      <div id="said" aria-label="对话内容" tabindex="0"></div>
      <button type="button" id="latest" hidden>回到最新 ↓</button>
    </div>
    <section id="asks" aria-label="等你确认" hidden></section>
    <div id="stands" class="idle">
      <span class="dot" aria-hidden="true"></span><span id="standing"></span><span id="clock"></span>
      <button type="button" id="go" hidden>继续</button>
      <button type="button" id="again" hidden>继续这段对话</button>
    </div>
    <div id="switch-bar" hidden>
      <span id="switch-bar-icon" aria-hidden="true"></span>
      <span id="switch-bar-text"></span>
      <button type="button" id="switch-cancel">取消</button>
    </div>
    <form id="write">
      <textarea id="box" rows="1" maxlength="8000" placeholder="发消息" spellcheck="false" autocapitalize="off" aria-label="消息"></textarea>
      <div id="write-end">
        <button type="button" id="params-btn" hidden aria-label="模型与参数"><span id="params-icon" aria-hidden="true"></span><svg class="params-chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="stop" class="round" hidden aria-label="停止"><span class="stop-mark" aria-hidden="true"></span></button>
        <button type="submit" id="send" class="round" aria-label="发送"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V5.5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="send-done" hidden></span></button>
      </div>
    </form>
  </main>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
