<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>同类论文定标尺与敏感性四问</title>
<link rel="stylesheet" href="../../../card.css">
<style>
  .card { margin-top: 16px; padding: 18px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
  .card .k { display: inline-block; padding: 3px 10px; border-radius: 999px; background: var(--dark); color: #fff; font-size: 12.5px; font-weight: 800; }
  .card b { display: block; margin-top: 9px; font-size: 18.5px; line-height: 1.32; font-weight: 800; }
  .card p { margin: 7px 0 0; font-size: 14px; line-height: 1.55; color: var(--muted); }
  .qs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .q { padding: 9px 11px; border-radius: 11px; background: #f6f3ec; font-size: 13px; line-height: 1.4; font-weight: 700; color: var(--ink); }
  .q em { font-style: normal; color: var(--blue); margin-right: 4px; }
  .cap { margin-top: 12px; padding: 10px 13px; border-radius: 12px; background: #edf3fe; color: var(--ink); font-size: 13.2px; line-height: 1.5; font-weight: 700; }
</style>
</head>
<body>
  <span class="chip">03 · 工作流做法（上）</span>
  <h1>拿<span class="blue">同类论文</span>定标尺<br>用四问管住<span class="mark">敏感性</span></h1>
  <div class="card">
    <span class="k">闸门 1</span>
    <b>动笔前先对齐目标期刊同类论文</b>
    <p>先看同类已发表文章方法写多细、表注列几项、各节占多少篇幅。范文有而自己薄的补足，范文没有的防御性理由和例行诊断直接删。</p>
  </div>
  <div class="card">
    <span class="k">闸门 2</span>
    <b>敏感性分析先过四问，全“是”才做</b>
    <div class="qs">
      <div class="q"><em>1</em>能指出检验哪项假设？</div>
      <div class="q"><em>2</em>是否回答同一问题？</div>
      <div class="q"><em>3</em>结果是否可能不同？</div>
      <div class="q"><em>4</em>不同时是否动摇结论？</div>
    </div>
    <div class="cap">篇幅卡死：方法合写一段，结果 1–3 句指向附表，只有结果反转改变结论时才展开。</div>
  </div>
  <div class="foot"><b>EpiAgentKit</b><span>科研 AI 工作流</span><span class="page">4 / 6</span></div>
</body>
</html>
