<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小结</title>
<link rel="stylesheet" href="../../../card.css">
<style>
  .safe { margin-top: 22px; padding: 20px 22px; border-radius: 18px; background: var(--dark); color: #fff; }
  .safe b { display: block; font-size: 19px; font-weight: 800; }
  .safe ul { margin: 12px 0 0; padding: 0; display: grid; gap: 11px; }
  .safe li { font-size: 14.8px; line-height: 1.52; list-style: none; padding-left: 18px; position: relative; }
  .safe li::before { content: ""; position: absolute; left: 0; top: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--mark); }
  .find { margin-top: 18px; padding: 16px 18px; background: var(--card); border: 1.5px dashed var(--blue); border-radius: 16px; }
  .find b { display: block; font-size: 17px; font-weight: 800; }
  .find em { font-style: normal; }
  .find span { display: block; margin-top: 5px; color: var(--muted); font-size: 13.5px; line-height: 1.55; }
  .ask { margin-top: 14px; padding: 14px 18px; border-radius: 16px; background: #edf3fe; font-size: 14.5px; line-height: 1.5; font-weight: 700; color: var(--ink); text-align: center; }
</style>
</head>
<body>
  <span class="chip">实践小结</span>
  <h1>让 AI 像<span class="mark">成熟研究者</span><br>而不是答题机器</h1>
  <div class="safe">
    <b>管住 AI 的“求全欲”，抓住四件事</b>
    <ul>
      <li>观念来自实践：先认清“全面”和“合适”不是一回事</li>
      <li>标尺来自同类论文：不多堆防备材料，也不写薄关键内容</li>
      <li>分析服从研究问题：主分析站主角位，敏感性分析精准核查</li>
      <li>讨论与局限讲实话：有依据才写，不靠免责套话自保</li>
    </ul>
  </div>
  <div class="find">
    <b>已整理进科研工作流 <em class="blue">EpiAgentKit</em></b>
    <span>包含科研项目规则、统计分析原则、论文起草与中文学术语体审校等 skills，按场景自动调用。</span>
  </div>
  <div class="ask">用 AI 写论文还踩过哪些“用力过猛”的坑？欢迎评论区聊聊</div>
  <div class="foot"><b>EpiAgentKit</b><span>科研 AI 工作流</span><span class="page">6 / 6</span></div>
</body>
</html>
