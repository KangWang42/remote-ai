<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>什么是防御性写作</title>
<link rel="stylesheet" href="../../../card.css">
<style>
  body { padding-top: 34px; }
  h1 { margin-top: 12px; font-size: 38px; }
  .lead { margin-top: 10px; font-size: 16px; line-height: 1.5; }
  .rows { gap: 10px; margin-top: 16px; }
  .row { padding: 13px 16px; }
  .row b { font-size: 17.5px; }
  .row span { font-size: 13.8px; line-height: 1.48; }
  .bar { margin-top: 14px; padding: 14px; font-size: 18px; }
</style>
</head>
<body>
  <span class="chip">01 · 为什么会这样</span>
  <h1>AI 天生追求<span class="mark">全面</span><br>但科研不是答题</h1>
  <p class="lead">AI 训练目标是滴水不漏、谁都挑不出刺，放到写论文里就变成了过度防御：</p>
  <div class="rows">
    <div class="row">
      <div class="n">1</div>
      <div>
        <b>方法求“强”不求“熟”</b>
        <span>搬出没人用的复杂模型，审稿人和评委看不懂，再强也没用</span>
      </div>
    </div>
    <div class="row">
      <div class="n">2</div>
      <div>
        <b>敏感性分析做到“敏感死”</b>
        <span>别人做个简单分层就合适，它非要堆十几个，还想塞进主表</span>
      </div>
    </div>
    <div class="row">
      <div class="n">3</div>
      <div>
        <b>到处自曝无关缺陷</b>
        <span>每段末尾加免责声明，提出来确实全面，其实是在自找麻烦</span>
      </div>
    </div>
  </div>
  <div class="bar">为了“完整”疯狂堆料，不是好科研助手</div>
  <div class="foot"><b>EpiAgentKit</b><span>科研 AI 工作流</span><span class="page">2 / 6</span></div>
</body>
</html>
