<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>一轮怎么走</title>
<link rel="stylesheet" href="../../../card.css">
<style>
  .flow { display: grid; gap: 8px; width: 238px; margin-top: 22px; }
  .step { padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .step b { display: block; font-size: 16.5px; font-weight: 800; }
  .step span { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .arrow { padding-left: 18px; color: var(--blue); font-size: 15px; font-weight: 800; line-height: 1; }
  .step.no { background: var(--dark); border-color: var(--dark); color: #fff; }
  .step.no span { color: #c9ced8; }
  .phone { width: 228px; right: 22px; top: 136px; }
  .screen { height: 500px; }
</style>
</head>
<body>
  <span class="chip">分工协作的一轮</span>
  <h1>验收不过<br><span class="mark">就再来一轮</span></h1>
  <div class="flow">
    <div class="step"><b>领队派工</b><span>按目标和已有改动拆给成员</span></div>
    <div class="arrow">↓</div>
    <div class="step"><b>成员动手、汇报</b><span>只交进度不算数，做完再交</span></div>
    <div class="arrow">↓</div>
    <div class="step"><b>领队验收</b><span>对照改动和测试结果核对</span></div>
    <div class="arrow">↓</div>
    <div class="step no"><b>没通过？</b><span>写清问题，进入下一轮</span></div>
  </div>
  <div class="phone"><div class="screen"><img src="../../../shots/team-log.png" alt="" style="margin-top: -52px"></div></div>
  <div class="foot"><b>Remote AI</b><span>GitHub 搜 remote-ai</span><span class="page">4 / 6</span></div>
</body>
</html>
