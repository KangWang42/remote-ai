<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>细节</title>
<link rel="stylesheet" href="../../../card.css">
<style>
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
  .cell { padding: 15px 15px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
  .cell b { display: block; font-size: 17px; font-weight: 800; line-height: 1.35; }
  .cell span { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.55; }
</style>
</head>
<body>
  <span class="chip">用下来顺手的地方</span>
  <h1>几个<span class="mark">细节</span></h1>
  <div class="grid">
    <div class="cell"><b>轮数自己定</b><span>固定 1 到 10 轮，或者自由轮数，由领队判断什么时候结束</span></div>
    <div class="cell"><b>模型分开选</b><span>领队和每个成员单独选工具、模型和思考深度</span></div>
    <div class="cell"><b>同一工具多开</b><span>两个 Codex 各做一块，同账号共用额度</span></div>
    <div class="cell"><b>看着额度派工</b><span>领队能看到各工具剩余额度，用尽的不再派活</span></div>
    <div class="cell"><b>随时插一句</b><span>插话、点名提醒某个成员，或者换 AI、停止</span></div>
    <div class="cell"><b>电脑上也能发起</b><span>Windows 电脑端和手机打开的是同一个任务</span></div>
  </div>
  <div class="bar">最多同时跑 3 个协作任务</div>
  <div class="foot"><b>Remote AI</b><span>GitHub 搜 remote-ai</span><span class="page">5 / 6</span></div>
</body>
</html>
